<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Race Setup, option B</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
.sf,.sf *{box-sizing:border-box}
.sf button{font-family:inherit;color:inherit;cursor:pointer;text-align:left}
.sf h2,.sf p{margin:0}
.sf .hero{display:flex;align-items:center;gap:14px;width:100%;padding:14px 14px;border-radius:12px;border:1px solid var(--accent-solid);background:var(--accent-solid);color:#fff}
.hero:hover{filter:brightness(1.08)}
.hero[aria-selected="true"]{box-shadow:0 0 0 2px var(--panel),0 0 0 4px var(--ink)}
.hero .hico{width:42px;height:42px;border-radius:50%;background:rgba(255,255,255,.18);display:flex;align-items:center;justify-content:center;flex:none}
.hero strong{display:block;font-size:17px;line-height:1.2}
.hero small{display:block;font-size:12px;line-height:1.3;color:#fff;margin-top:3px}
.glabel{font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:0 8px}
.ri{display:flex;align-items:center;gap:11px;width:100%;padding:5px 10px 5px 6px;border-radius:9px;border:1px solid transparent;background:none;font-size:14px;line-height:1.2;color:var(--ink)}
.ri .rt{width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;background:color-mix(in srgb,var(--c) 18%,var(--panel));color:var(--c);flex:none}
.ri:hover{background:color-mix(in srgb,var(--c) 10%,var(--panel))}
.ri[aria-selected="true"]{background:color-mix(in srgb,var(--c) 22%,var(--panel));border-color:var(--c);font-weight:700}
.ri[aria-selected="true"] .rt{background:var(--c);color:var(--bg)}
.bar{border-radius:6px;background:var(--line)}
</style>
</helmet>
<div class="sf" style="width:1000px;height:640px;padding:24px;background:var(--bg);color:var(--ink);font-family:'Segoe UI',system-ui,sans-serif;font-size:14px;line-height:1.45;--bg:#171b21;--panel:#222831;--ink:#e8e6e1;--muted:#98a0ab;--line:#343b47;--accent-solid:#c8363c;--c-rot:#c4803f;--c-fuel:#2fb86a;--c-pen:#f2b705;--c-dmg:#e5484d;--c-tyre:#9b4dff;--c-wx:#4c9aff;--c-bop:#e8e6e1;--c-tok:#1fb5ad;display:flex;gap:20px;align-items:flex-start">

  <div role="tablist" aria-label="Race Setup sections" aria-orientation="vertical" style="width:236px;flex:none;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:14px">
    <button type="button" role="tab" aria-selected="false" class="hero">
      <span class="hico"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 22V4"></path><path d="M4 4h14l-2.5 4.5L18 13H4"></path></svg></span>
      <span><strong>Race Setups</strong><small>Where it all comes together</small></span>
    </button>

    <div style="display:flex;flex-direction:column;gap:3px">
      <span class="glabel">Setups</span>
      <button type="button" role="tab" aria-selected="false" class="ri" style="--c:var(--c-rot)"><span class="rt"><svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path><path d="M3 3v5h5"></path><path d="M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16"></path><path d="M16 16h5v5"></path></svg></span>Rotation Setups</button>
      <button type="button" role="tab" aria-selected="false" class="ri" style="--c:var(--c-fuel)"><span class="rt"><svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 22h12"></path><path d="M4 9h10"></path><path d="M14 22V4a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v18"></path><path d="M14 13h2a2 2 0 0 1 2 2v2a2 2 0 0 0 2 2 2 2 0 0 0 2-2V9.83a2 2 0 0 0-.59-1.42L18 5"></path></svg></span>Fuel Setups</button>
    </div>

    <div style="display:flex;flex-direction:column;gap:3px">
      <span class="glabel">Systems</span>
      <button type="button" role="tab" aria-selected="false" class="ri" style="--c:var(--c-pen)"><span class="rt"><svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3"></path><path d="M12 9v4"></path><path d="M12 17h.01"></path></svg></span>Penalty Systems</button>
      <button type="button" role="tab" aria-selected="false" class="ri" style="--c:var(--c-dmg)"><span class="rt"><svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"></path></svg></span>Damage Systems</button>
      <button type="button" role="tab" aria-selected="true" class="ri" style="--c:var(--c-tyre)"><span class="rt"><svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><circle cx="12" cy="12" r="3.5"></circle><path d="M12 3v5.5"></path><path d="M12 15.5V21"></path><path d="M3 12h5.5"></path><path d="M15.5 12H21"></path></svg></span>Tyre Wear Systems</button>
      <button type="button" role="tab" aria-selected="false" class="ri" style="--c:var(--c-wx)"><span class="rt"><svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 14.9A7 7 0 1 1 15.7 8h1.8a4.5 4.5 0 0 1 2.5 8.2"></path><path d="M16 14v6"></path><path d="M8 14v6"></path><path d="M12 16v6"></path></svg></span>Weather Systems</button>
    </div>

    <div style="display:flex;flex-direction:column;gap:3px">
      <span class="glabel">Extras</span>
      <button type="button" role="tab" aria-selected="false" class="ri" style="--c:var(--c-bop)"><span class="rt"><svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v18"></path><path d="M5 21h14"></path><path d="M5 7h14"></path><path d="m5 7-3 8a4 4 0 0 0 6 0z"></path><path d="m19 7-3 8a4 4 0 0 0 6 0z"></path></svg></span>Balance of Power</button>
      <button type="button" role="tab" aria-selected="false" class="ri" style="--c:var(--c-tok)"><span class="rt"><svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="13" r="8"></circle><path d="M12 9v4l2 2"></path><path d="M9 2h6"></path></svg></span>Time Tokens</button>
    </div>
  </div>

  <div style="flex:1;min-width:0;background:var(--panel);border:1px solid var(--line);border-top:4px solid var(--c-tyre);border-radius:10px;padding:20px 24px 24px">
    <div style="display:flex;align-items:center;gap:12px">
      <span style="width:34px;height:34px;border-radius:9px;background:color-mix(in srgb,var(--c-tyre) 22%,var(--panel));color:var(--c-tyre);display:flex;align-items:center;justify-content:center;flex:none"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><circle cx="12" cy="12" r="3.5"></circle><path d="M12 3v5.5"></path><path d="M12 15.5V21"></path><path d="M3 12h5.5"></path><path d="M15.5 12H21"></path></svg></span>
      <h2 style="font-size:22px;font-weight:700">Tyre Wear Systems</h2>
    </div>
    <p style="margin-top:10px;color:var(--muted)">A tyre wear system makes the tyres lose life while a car drives, from 100% to 0%. New tyres help the car, worn out tyres hinder it, and a pit stop gives a fresh set. Choose one in a race setup (Racing Systems).</p>
    <div aria-hidden="true" style="margin-top:22px;display:flex;flex-direction:column;gap:12px">
      <div style="display:flex;align-items:center;gap:16px;padding:14px 16px;border:1px solid var(--line);border-radius:10px;background:var(--bg)"><div class="bar" style="width:150px;height:14px"></div><div class="bar" style="width:170px;height:10px;opacity:.6"></div><div style="flex:1"></div><div class="bar" style="width:56px;height:28px;border-radius:8px"></div></div>
      <div style="display:flex;align-items:center;gap:16px;padding:14px 16px;border:1px solid var(--line);border-radius:10px;background:var(--bg)"><div class="bar" style="width:120px;height:14px"></div><div class="bar" style="width:200px;height:10px;opacity:.6"></div><div style="flex:1"></div><div class="bar" style="width:56px;height:28px;border-radius:8px"></div></div>
      <div style="display:flex;align-items:center;gap:16px;padding:14px 16px;border:1px solid var(--line);border-radius:10px;background:var(--bg)"><div class="bar" style="width:170px;height:14px"></div><div class="bar" style="width:150px;height:10px;opacity:.6"></div><div style="flex:1"></div><div class="bar" style="width:56px;height:28px;border-radius:8px"></div></div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1000,"height":640}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
